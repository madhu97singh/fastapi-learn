services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: fastapi_learn
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      DATABASE_URL: mysql+pymysql://root:secret@db:3306/fastapi_learn
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
